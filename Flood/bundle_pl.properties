# Tutorial entries
tutorial.entry0.title = Witaj!
tutorial.entry0.contents = [lightgray]Witaj w [accent]interaktywnym menu samouczka[]!\
  \n[accent]Wybierz kategori\u0119 samouczka[] kt\u00F3r\u0105 chcesz zobaczy\u0107 u\u017Cywaj\u0105c przycisk\u00F3w!
tutorial.entry1.title = Ups...
tutorial.entry1.contents = [accent]Hej ty!\
  \n\n[lightgray]Wygl\u0105da na to i\u017C nie przeczyta\u0142e\u015B samouczka, mo\u017Ce przejrzymy kilka stron?
tutorial.entry2.title = Witaj!
tutorial.entry2.contents = [accent]Hejka!\
  \n\n[lightgray]Wygl\u0105da na to \u017Ce sp\u0119dzi\u0142e\u015B ju\u017C tutaj troch\u0119 czasu.\
  \nRozwa\u017C po\u015Bwi\u0119cenie [white]paru minut[] aby przeczyta\u0107 samouczek, nasze zmiany mog\u0105 ci\u0119 zaskoczy\u0107!
tutorial.entry3.title = Samouczek Stra\u017Cnika
tutorial.entry3.contents = [accent]Witaj!\
  \n\n[lightgray]Wygl\u0105da na to i\u017C zosta\u0142e\u015B wybrany jako stra\u017Cnik, om\u00F3wmy twoje zadania:\
  \n[accent]>[] Pomagaj floodowi atakowa\u0107 przeciwnika\
  \n[accent]>[] Tw\u00F3rz pu\u0142apki i inne budowle wewn\u0105trz flooda\
  \n[accent]>[] U\u017Cywaj dedykowanych komend (/tutorial) aby siebie wspom\u00F3c!\
  \n\nJe\u017Celi nie chcesz gra\u0107 jako stra\u017Cnik, u\u017Cyj /resign aby wr\u00F3ci\u0107 do twojej dru\u017Cyny!\
  \nPowodzenia!
# yes, manually adding the title page is horrible, but i don't feel like implementing an automated way for that rn
tutorial.entry4.title = [accent]\uE875 Samouczek (1/5)
tutorial.entry4.contents = [blue]\uE83B Flood[] to tryb gry w stylu ataku gdzie twoim celem jest [salmon]dezaktywacja[] wszystkich\
  \n[]\uF867 [gold]Emiter\u00F3w []oraz [red]zniszczenie[] wszystkich \uF727 [gold]Specjalnych Emiter\u00F3w.
tutorial.entry5.title = [accent]\uE875 Samouczek (2/5)
tutorial.entry5.contents = \uF867 [gold]Emitery []rozprzestrzeniaj\u0105 [blue]Flooda[], kt\u00F3ry [red]uszkadza[] pobliskie budynki oraz jednostki.
tutorial.entry6.title = [accent]\uE875 Samouczek (3/5)
tutorial.entry6.contents = Mo\u017Cesz tymczasowo [salmon]dezaktywowa\u0107 []\uF867 [gold]Emitery[] zadaj\u0105c im wystarczaj\u0105c\u0105 liczb\u0119 [red]obra\u017Ce\u0144[]\
  \n\nGdy \uF867 [gold]Emitery []s\u0105 dezaktywowane, mo\u017Cna [salmon]wyeliminowa\u0107[] je poprzez uruchomienie\
  \n\uF871 [accent]Reaktora Uderzeniowego [] / \uF689 [accent]B\u0142ysku []w pobli\u017Cu.
tutorial.entry7.title = [accent]\uE875 Samouczek (4/5)
tutorial.entry7.contents = Kilka porad aby pom\u00F3c ci prze\u017Cy\u0107!\
  \n\uF898[accent]Projektory Pola Si\u0142owego[] s\u0105 bardzo efektywne w spowalnianiu Flooda.\
  \n\uF8AE[accent]Spam \u015Bcian[] jest dobr\u0105 metod\u0105 na wczesne przepychanie Flooda.\
  \n\uF7FA[accent]Anticreep[] jest pot\u0119\u017Cnym narz\u0119dziem przeciwko Emiterom oraz Floodowi.
tutorial.entry8.title = [accent]\uE875 Samouczek (5/5)
tutorial.entry8.contents = Rekomendujemy pobranie [blue]Floodcompat[] z wbudowanej [accent]Przegl\u0105darki Mod\u00F3w[].\
  \nRedukuje on niekt\u00F3re problemy, pozwala przemieszcza\u0107 si\u0119 po niekt\u00F3rych warstwach Flooda, itd.
tutorial.entry9.title = [accent]\uE875 Samouczek
tutorial.entry9.contents = [blue]\uE83B Flood[] zawiera wiele wi\u0119cej [pink]specjalnych mechanik.\
  \nMo\u017Cesz dowiedzie\u0107 si\u0119 wi\u0119cej wybieraj\u0105c pozosta\u0142e kategorie w g\u0142\u00F3wnym menu samouczka!
tutorial.entry10.title = [accent]\uE85B Mechaniki | \uE83B Flood (1/12)
tutorial.entry10.contents = \uF867 [red]Emitery[]\
  \n\n[accent]Rdzenie z Serpulo[] rozprzestrzeniaj\u0105 [blue]Flood[].\
  \nMo\u017Cesz je [salmon]dezaktywowa\u0107[] poprzez [red]zadawanie obra\u017Ce\u0144[] lub u\u017Cycie [cyan]anticreep[].\
  \nAby wygra\u0107, musisz [salmon]dezaktywowa\u0107[] wszystkie [gold]Emitery[].\
  \nIch [red]eliminacja[] jest opcjonalna.
tutorial.entry11.title = [accent]\uE85B Mechaniki | \uE83B Flood (2/12)
tutorial.entry11.contents = \uF727 [red]Specjalne Emitery[]\
  \n\n[accent]Rdzenie z Erekira[] oraz [accent]Wyrzutnie[] musz\u0105 si\u0119 [coral]na\u0142adowa\u0107[] przed rozprzestrzenianiem [blue]Flooda[].\
  \nPo [coral]na\u0142adowaniu[], [gold]Specjalny Emiter[] zacznie rozprzestrzenia\u0107 ogromne ilo\u015Bci [blue]Flooda[] bardzo szybko.\
  \n[accent]Uodporniaj\u0105[] si\u0119 od obra\u017Ce\u0144 podczas rozprzestrzeniania oraz gdy s\u0105 otoczone du\u017Cymi ilo\u015Bciami [blue]Flooda[].\
  \nMo\u017Cesz zniszczy\u0107 ich [accent]odporno\u015B\u0107[] oraz zada\u0107 wi\u0119cej [red]obra\u017Cen[] u\u017Cywaj\u0105c [cyan]anticreep[].
tutorial.entry12.title = [accent]\uE85B Mechaniki | \uE83B Flood (3/12)
tutorial.entry12.contents = \uF872 [red]Wyrzutnie Zarodnik\u00F3w[]\
  \n\n[accent]Reaktory Torowe[] wystrzelaj\u0105 dalekozasi\u0119gow\u0105 artyleri\u0119 zwan\u0105 [purple]zaridnikami[], kt\u00F3ra rozprzestrzenia [blue]Flooda[] po kolizji.\
  \nMo\u017Cesz obroni\u0107 si\u0119 przed [purple]zarodnikami[] u\u017Cywaj\u0105c\
  \n\uF80E [accent]Segment\u00F3w[], \uF682 [accent]Wie\u017C Antybalistycznych[],\
  \n\uF898 [accent]Projektor\u00F3w Pola Si\u0142owego[], \uF7AA[accent]Tarcz Jednostek[].\
  \n[purple]Zarodnki[] mog\u0105 zderza\u0107 si\u0119 z jednostkami, trac\u0105c ca\u0142y przenoszony [blue]Flood[], aczkolwiek, artyleria pozostaje i wci\u0105\u017C mo\u017Ce zada\u0107 obra\u017Cenia.
tutorial.entry13.title = [accent]\uE85B Mechaniki | \uE83B Flood (4/12)
tutorial.entry13.contents = \uF88B [red]Katapulty Flooda[]\
  \n\n[accent]Katapulty Masy[] zbieraj\u0105 i transportuj\u0105 [blue]Flood[] na d\u0142ugie dystansy.
tutorial.entry14.title = [accent]\uE85B Mechaniki | \uE83B Flood (5/12)
tutorial.entry14.contents = \uF6AD [red]Radary Flooda[]\
  \n\n[accent]Radary[] zadaj\u0105 [red]obra\u017Cenia[] [accent]jednostce[] z najwi\u0119ksz\u0105 ilo\u015Bci\u0105 \u017Cycia po kr\u00F3tkim \u0142adowaniu.\
  \nObra\u017Cenia skaluj\u0105 si\u0119 z ustawieniami mno\u017Cnika obra\u017Ce\u0144 jednostek Flooda.
tutorial.entry15.title = [accent]\uE85B Mechaniki | \uE83B Flood (6/12)
tutorial.entry15.contents = \uF682 [red]Projektory Flooda[]\
  \n\n[accent]Wie\u017Ce Antybalistyczne[] rozprzestrzeniaj\u0105 [blue]Flooda[] na budynki w ich zasi\u0119gu.
tutorial.entry16.title = [accent]\uE85B Mechaniki | \uE83B Flood (7/12)
tutorial.entry16.contents = \uF7FA [red]Jednostki Flooda[]\
  \n\n[accent]Jednostki z drzewka Pe\u0142zak\u00F3w[] eksploduj\u0105 i rozprzestrzeniaj\u0105 [blue]Flood []w kontakcie z budynkami.\
  \n[orange]Jednostki wy\u017Cszych poziom\u00F3w[] rozprzestrzeniaj\u0105 wi\u0119cej Flooda.
tutorial.entry17.title = [accent]\uE85B Mechaniki | \uF77C Gracze (8/12)
tutorial.entry17.contents = [cyan]Anticreep[]\
  \n\nIstniej\u0105 3 sposoby na u\u017Cycie [cyan]Anticreep[], kt\u00F3ry tymczasowo blokuje [blue]Flooda[] od rozprzestrzeniania si\u0119 w afektowanym obszarze.\
  \n\uF897 [accent]Miny Ra\u017C\u0105ce[] - [sky]Ma\u0142y[] obszar z [sky]kr\u00F3tkim[] okresem dzia\u0142ania.\
  \n\uF7FA [accent]Pe\u0142zaki[] - [sky]\u015Aredni[] obszar z [sky]\u015Brednim[] okresem dzia\u0142ania.\
  \n\uF687[accent]Zam\u0119t[] - [sky]Du\u017Cy[] obszar z [sky]d\u0142ugim[] okresem dzia\u0142ania.\
  \n\n[crimson]\u26A0 Uwaga! \u26A0\
  \n[cyan]Anticreep [red]nie usuwa[white] [blue]Flooda[] z afektowanego obszaru.
tutorial.entry18.title = [accent]\uE85B Mechaniki | \uF77C Gracze (9/12)
tutorial.entry18.contents = \uF7AA[green]Tarcze Jednostek[]\
  \n\n\uF7FB [gold]Kwazary[] i \uF7C2 [gold]Octy[] posiadaj\u0105 tarcze, kt\u00F3re zadaj\u0105 [red]obra\u017Cenia[] [blue]Floodowi[].\
  \n[accent]Tarcze[] otrzymuj\u0105 [red]obra\u017Cenia[] podczas atakowania.\
  \nPostaraj si\u0119 nie u\u017Cywa\u0107 ich zbyt agresywnie!
tutorial.entry19.title = [accent]\uE85B Mechaniki | \uF77C Gracze (10/12)
tutorial.entry19.contents = \uF898 [green]Projektory Pola Si\u0142owego[]\
  \n\nW przeciwie\u0144stwie do [accent]Tarcz Jednostek[], [gold]Projektory Pola Si\u0142owego[] spowalniaj\u0105 [blue]Flooda[].\
  \nIch g\u0142ownym zastosowaniem jest wczesna obrona oraz pomoc w ataku.\
  \n[gold]Projektory Pola Si\u0142owego[] zostaj\u0105 zniszczone natychmiastowo je\u017Celi zaatakuje je [blue]Flood[].
tutorial.entry20.title = [accent]\uE85B Mechaniki | \uF77C Gracze (11/12)
tutorial.entry20.contents = \uF6AD [green]Radary[]\
  \n\n[gold]Radary[] z dru\u017Cyny gracza przemieniaj\u0105 [blue]Flooda[] w surowce.\
  \nPotrzebuj\u0105 one [accent]Kontenera[] z jednej ze stron [gold]Radar[], aby przekaza\u0107 surowce.\
  \nR\u00F3\u017Cne [blue]poziomy Flooda[] daj\u0105 r\u00F3zne surowce.\
  \nIstnieje [accent]limit[] ilo\u015Bci [gold]Radar\u00F3w[] kt\u00F3re mo\u017Cesz posiada\u0107 jednocze\u015Bnie.\
  \nAby dowiedzie\u0107 si\u0119 wi\u0119cej, u\u017Cyj [slate]/radarinfo[].
tutorial.entry21.title = [accent]\uE85B Mechaniki | \uF77C Gracze (12/12)
tutorial.entry21.contents = \uF866 [green]Sk\u0142adowiska[]\
  \n\nCzasami [gold]Sk\u0142adowiska[] mog\u0105 wyst\u0105pi\u0107 wewn\u0105trz [blue]Flooda[], posiadaj\u0105 one r\u00F3\u017Cne surowce.\
  \nPrzejmij [gold]Sk\u0142adowisko[] aby otrzyma\u0107 dost\u0119p do zawartych w nim surowc\u00F3w.\
  \n[scarlet]\u26A0 Uwa\u017Caj aby ich nie uszkodzi\u0107[], jako i\u017C [gold]Sk\u0142adowisko[] oraz jego surowce [red]zwyczajnie [crimson]znikn\u0105.
tutorial.entry22.title = [accent]\uE833 Inne (1/6)
tutorial.entry22.contents = \uF7E4 [pink]Logika[]\
  \n\nWprowadzili\u015Bmy pewne limitacje dotycz\u0105ce [accent]Logiki[] aby zbalansowa\u0107 jej u\u017Cycie.\
  \nProcesory nie mog\u0105 kontrolowa\u0107 jednostek aby wydobywa\u0142y surowce, strzela\u0142y, czy wchodzi\u0142y do budynk\u00F3w.\
  \nDodatkowo, budowa\u0107 mo\u017Cna jedynie \uF7E4 [accent]Mikroprocesory[].
tutorial.entry23.title = [accent]\uE833 Inne (2/6)
tutorial.entry23.contents = \uE85E [pink]MinerAI[]\
  \n\n[sky]Logika Wydobycia Surowc\u00F3w[] nie jest potrzebna!\
  \n[sky]Jednostki[] b\u0119d\u0105 wydobywa\u0107 \uF834 piasek, \uF833 w\u0119giel i \uF830 z\u0142om bez logiki.\
  \nB\u0119d\u0105 one tak\u017Ce [tan]omija\u0107[] [blue]Flood[] podczas wydobywania.\
  \nJako i\u017C MinerAI pracuje na serwerze, jest ono [tan]szybsze[] i mniej ograniczone ni\u017C jakakolwiek logika.
tutorial.entry24.title = [accent]\uE833 Inne (3/6)
tutorial.entry24.contents = \uE84D [pink]Odporno\u015B\u0107[]\
  \n\n\uF7F1 [accent]Mr\u00F3wki[] oraz \uF7F5 [accent]Horyzonty[] s\u0105 [gold]odporne[] na [blue]flooda[], co sprawia \u017Ce s\u0105 one \u015Bwietnymi jednostkami do przenoszenia surowc\u00F3w.\
  \n\uF7F5 [accent]Horyzonty[] s\u0105 [red]rozbrojone[], przez co nie mog\u0105 zadawa\u0107 obra\u017Ce\u0144.\
  \nIch pojemno\u015B\u0107 zosta\u0142a przywr\u00F3cona do 20 surowc\u00F3w.
tutorial.entry25.title = [accent]\uE833 Inne (4/6)
tutorial.entry25.contents = \uF899 [pink]Podkr\u0119cenie[]\
  \n\n[gold]Projektory Pola Przy\u015Bpieszenia[] daj\u0105 pobliskim jednostkom status \uF7AB [accent]Podkr\u0119cenia[].
tutorial.entry26.title = [accent]\uE833 Inne (5/6)
tutorial.entry26.contents = \uF8AC [pink]\u015Aciany[]\
  \n\nMa\u0142e \uF8A0 [accent]Z\u0142omiane[], \uF8AC [accent]Tytanowe[] i\
  \n\uF8A8 [accent]Torowe[] \u015Bciany nie blokuj\u0105 jednostek.\
  \nJe\u017Celi chcesz porusza\u0107 si\u0119 po nich gdy kontrolujesz jednostk\u0119, musisz zainstalowa\u0107 [blue]Floodcompat[].
tutorial.entry27.title = [accent]\uE833 Inne (6/6)
tutorial.entry27.contents = \uF7E9 [pink]Pomocnicy[]\
  \n\nKa\u017Cdy [accent]Rdze\u0144[] przywo\u0142uje [gold]Pomocnika[].\
  \n[gold]Pomocnicy[] mog\u0105 wydobywa\u0107 surowce, pomaga\u0107 w budowie lub atakowa\u0107.
tutorial.entry28.title = [accent]\uE827 Tryby Gry (1/3)
tutorial.entry28.contents = [sky]\uE861 Flood PvP[]\
  \n\nPvP, ale z [blue]Floodem[]!\
  \nIstnieje kilka specjalnych mechanik:\
  \n- Wielok\u0105tna Ochrona Rdzenia jest w\u0142\u0105czona podczas startu gry\
  \n- Wy\u017Csze poziomy jednostek z drzewka Pe\u0142zaczy rozprzestrzeniaj\u0105 Flooda podczas kontaktu z budynkami przeciwnika
tutorial.entry29.title = [accent]\uE827 Tryby Gry (2/3)
tutorial.entry29.contents = [sky]\uE86E Stra\u017Cnik[]\
  \n\nJeden z graczy zostaje przeniesiony na dru\u017Cyn\u0119 [blue]Flooda[].\
  \nJego zadaniem jest pom\u00F3c wygra\u0107 [blue]Floodowi[].\
  \nDostaje on dost\u0119p do specjalnych komend pomagaj\u0105cych w wykonaniu zadania.
tutorial.entry30.title = [accent]\uE827 Tryby Gry (3/3)
tutorial.entry30.contents = [sky]\uE82D Randomizer[]\
  \n\nRudy, \u015Bciany oraz pod\u0142ogi mapy zostaj\u0105 zrandomizowane!\
  \nNiekt\u00F3re mapy s\u0105 randomizowane podczas startu gry, lub wiele razy po zdefiniowanych odst\u0119pach.\
  \n\nMo\u017Cesz rozpocz\u0105\u0107 g\u0142osowanie randomizacji mapy u\u017Cywaj\u0105c [slate]/scramble[].
tutorial.entry31.title = [accent]\uF129 Statystyki | \uE83B Flood (1/4)
tutorial.entry31.contents = \uF8A0 - 50 HP, [lightgray]Bez Kolizji[]\
  \n\uF8AC - 75 HP, [lightgray]Bez Kolizji[]\
  \n\uF8A8 - 100 HP, [lightgray]Bez Kolizji[]\
  \n\uF8A6 - 125 HP, [lightgray]Bez Odbijania Pocisk\u00F3w[]\
  \n\uF8A4 - 150 HP, [lightgray]Bez B\u0142yskawic[]\
  \n\uF693 - 175 HP, [lightgray]Bez B\u0142yskawic[]\
  \n\uF8AA - 200 HP, [lightgray]Blokuje Lasery[]\
  \n\uF6EE - 225 HP, [lightgray]Blokuje Lasery[]\
  \n\uF6F3 - 250 HP, [lightgray]Blokuje Lasery[]\
  \n\uF6BB - 300 HP, [lightgray]Blokuje Lasery[]\
  \n\n\uF6AD - Zasi\u0119g: 34 Kratki\
  \n\uF682 - Zasi\u0119g: 37.5 Kratki\
  \n\n\uF858 - \uF832 10 obra\u017Ce\u0144; \uF831 20 obra\u017Ce\u0144\
  \n\uF801 - 360 obra\u017Ce\u0144 na sekund\u0119
tutorial.entry32.title = [accent]\uF129 Statystyki | \uE86D Jednostki (2/4)
tutorial.entry32.contents = Drzewko \uF800 - \u015Arednie Obra\u017Cenia, Wysoka \u017Bywotno\u015B\u0107\
  \n\n\uF800 > [accent]+10%[] odporno\u015Bci na flood\
  \n\uF7FF > [green]+25%[white] odporno\u015Bci na flood\
  \n\uF7FE > []+20%[] odporno\u015Bci na flood\
  \n\uF7DB > [lime]+40%[] odporno\u015Bci na flood\
  \n\uF7DA > [green]+30%[] odporno\u015Bci na flood
tutorial.entry33.title = [accent]\uF129 Statystyki | \uE86D Jednostki (3/4)
tutorial.entry33.contents = Drzewko \uF7FA - \u015Arednie Obra\u017Cenia, \u015Arednia \u017Bywotno\u015B\u0107\
  \n\n\uF7FA > Rozprzestrzenia [cyan]anticreep[]\
  \n\uF7F9 > [accent]-10%[] odporno\u015Bci na flood\
  \n\uF7F8 > [orange]-70%[white] odporno\u015Bci na flood\
  \n> Leczenie dodane spowrotem\
  \n\uF7F7 > [scarlet]-220%[] odporno\u015Bci na flood\
  \n> Leczenie dodane spowrotem\
  \n> Artylerie: [scarlet]-100%[] obra\u017Ce\u0144 zadawanych emiterom\
  \n\uF7DE > []-125%[] odporno\u015Bci na flood
tutorial.entry34.title = [accent]\uF129 Statystyki | \uE86D Jednostki (4/4)
tutorial.entry34.contents = Drzewko \uF7FD - Wysokie Obra\u017Cenia, Niska \u017Bywotno\u015B\u0107\
  \n\n\uF7FD > [accent]-10%[white] odporno\u015Bci na flood\
  \n\uF7FC > []-15%[] odporno\u015Bci na flood\
  \n\uF7FB > [orange]-80%[] odporno\u015Bci na flood\
  \n\uF7C1 > [scarlet]-700%[white] odporno\u015Bci na flood\
  \n> [scarlet]-100%[] obra\u017Ce\u0144 zadawanych emiterom\
  \n\uF7C0 > [scarlet]-550%[white] odporno\u015Bci na flood\
  \n> [red]-80%[] obra\u017Ce\u0144 zadawanych emiterom
tutorial.entry35.title = [accent]\uE87C Ustawienia
tutorial.entry35.contents = \uF129 [accent]Ustawienia Meczu[]\
  \n\nAktualne Ustawienia To:\
  \nLimit Przywo\u0142anych Budynk\u00F3w: {0}\
  \nMo\u017Cliwo\u015B\u0107 Budowania: {1}\
  \n\nJe\u015Bli mo\u017Cliwo\u015B\u0107 budowania wynosi true, mo\u017Cesz budowa\u0107 cokolwiek je\u015Bli masz surowce i znajdujesz si\u0119 nad Floodem!
tutorial.entry36.title = [accent]\uF120 Komendy (1/6)
tutorial.entry36.contents = \uF120 [accent]Komendy[]\
  \n\nAby wspom\u00F3c twoje zadania, dodali\u015Bmy wiele komend u\u0142atwiaj\u0105cych r\u00F3zne aspekty!
tutorial.entry37.title = [accent]\uF120 Komendy (2/6)
tutorial.entry37.contents = \uF120 [accent]/build[]\
  \n\nBez argument\u00F3w, pokazuje list\u0119 dost\u0119pnych budynk\u00F3w\
  \nMo\u017Cesz przywo\u0142a\u0107 dany budynek podaj\u0105c jego nazw\u0119, oraz opcjonalnie koordynaty\
  \nIstnieje limit przywo\u0142ywania budynk\u00F3w, aczkolwiek, zwi\u0119ksza si\u0119 on o 1 co 10 minut
tutorial.entry38.title = [accent]\uF120 Komendy (3/6)
tutorial.entry38.contents = \uF120 [accent]/deposit[]\
  \n\nU\u017Cywa punkt\u00F3w aby przywo\u0142a\u0107 flood pod tob\u0105, jej ilo\u015B\u0107 zale\u017Cy od ilo\u015Bci twoich punkt\u00F3w oraz fazy gry
tutorial.entry39.title = [accent]\uF120 Komendy (4/6)
tutorial.entry39.contents = \uF120 [accent]/spawn[]\
  \n\nBez argument\u00F3w, pokazuje list\u0119 dost\u0119pnych jednostek\
  \nMo\u017Cesz przywo\u0142a\u0107 dan\u0105 jednostk\u0119 podaj\u0105c jej nazw\u0119, je\u017Celi posiadasz wystarczaj\u0105co punkt\u00F3w
tutorial.entry40.title = [accent]\uF120 Komendy (5/6)
tutorial.entry40.contents = \uF120 [accent]/area[]\
  \n\nBlokuje flooda w okr\u0119gu o podanej \u015Brednicy (min 3, max 10) pozwalaj\u0105c tobie budowa\u0107\
  \nMo\u017Cna wyznaczy\u0107 jedynie pojedy\u0144czy obszar budowy, u\u017Cycie komendy ponownie usuwa aktualny obszar
tutorial.entry41.title = [accent]\uF120 Komendy (6/6)
tutorial.entry41.contents = \uE815 [accent]/resign[]\
  \n\nUsuwa ciebie z pozycji stra\u017Cnika, inny gracz przejmie twoje miejsce je\u017Celi to mo\u017Cliwe\
  \nTa akcja nie mo\u017Ce zosta\u0107 cofni\u0119ta!