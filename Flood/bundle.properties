tutorial.guardian-settings = \uf129 [accent]Match Settings[]\
  \n\
  \nMax Buildings: {0}\
  \nElite Mode: {1}\
  \n\
  \nIn [scarlet]Elite Mode[], you can build anything if you have resources and are standing in Flood!
tutorial.guardian-commands0 = \uf120 [accent]/build[]\
  \n\
  \nSpawn supported buildings at your location or specific coordinates. The building limit increases by 1 every 10 minutes.\
  \nUse without arguments to see the building list and costs.
tutorial.guardian-commands1 = \uf120 [accent]/deposit[]\
  \n\
  \nSpend emitter points to deposit Flood. The amount scales with your points and game progression.
tutorial.guardian-commands2 = \uf120 [accent]/spawn[]\
  \n\
  \nSpend emitter points to spawn units\
  \nUse without arguments to see the unit list and costs.
tutorial.guardian-commands3 = \uf120 [accent]/area[]\
  \n\
  \nFreeze Flood in a radius (3–10 tiles) to allow free building.\
  \nOnly one area can be frozen at a time. Use the command again to unfreeze the area.
tutorial.guardian-commands4 = \ue815 [accent]/resign[]\
  \n\
  \nRemoves you from the guardian position. Another player will take over the guardian role if possible\
  \nThis cannot be undone!
