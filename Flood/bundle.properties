tutorial.stats1 = \uF800 Tree - Medium Damage, High Survivability\
  \n\n\uF800 > [accent]+10%[] flood resistance\
  \n\uF7FF > [green]+25%[white] flood resistance\
  \n\uF7FE > []+20%[] flood resistance\
