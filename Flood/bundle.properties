# Tutorial entries
tutorial.welcome.title = Welcome!
tutorial.welcome = [lightgray]Welcome to the [accent]Interactive Tutorial[]!\
  \nSelect a category below to learn more about Flood!
tutorial.forced.title = Oh well...
tutorial.forced = [accent]Hey there!\
  \n\
  \n[lightgray]It looks like you missed the tutorial. Let’s take a quick look together!
tutorial.reminder.title = Hi!
tutorial.reminder = [accent]Hey there!\
  \n\
  \n[lightgray]Looks like you’ve been playing for a while!\
  \nWhy not take [white]one minute[] to read the tutorial and discover new features?
tutorial.guardian.title = Guardian tutorial
tutorial.guardian = [accent]You are the Guardian!\
  \n\
  \n[lightgray]Your goal is to help Flood defeat the player team:\
  \n[accent]>[] Assist the Flood in attacking players.\
  \n[accent]>[] Create traps and structures within the Flood.\
  \n[accent]>[] Use [slate]/tutorial[] to see your exclusive commands.\
  \n\
  \nIf you'd rather not be the Guardian, use [slate]/resign[] to return to the player team.\
  \nGood luck!

tutorial.intro0 = [blue]\ue83b Flood[] is an attack-style mode. To win, you must [red]suspend[] all\
  \n[]\uf867 [stat]Emitters[] and [red]destroy[] all \uf727 [stat]Charged Emitters.
tutorial.intro1 = \uf867 [stat]Emitters[] produce [blue]Flood[], which [red]damages[] buildings and units.
tutorial.intro2 = [red]Suspend[] \uf867 [stat]Emitters[] by dealing constant [red]damage[].\
  \n\
  \nOnce fully suspended, they can be [orange]nullified[] by powering a nearby\
  \n\uf871 [accent]Impact Reactor[] or \uf689 [accent]Lustre[].
tutorial.intro3 = [accent]Quick Tips:\
  \n\
  \n\uf898[accent]Force Projectors[] are highly effective against Flood spreading.\
  \n\uf8ae[accent]Wallspamming[] helps defend early and push territory.\
  \n\uf7fa[accent]Anticreep[] is very powerful for pushing and suspending emitters.
tutorial.intro4 = It’s highly recommended to download [blue]Floodcompat[] from the [stat]\ue811 Mod Browser[] to reduce lag and desync.
tutorial.intro5 = There are many [pink]special features[] in Flood.\
  \nExplore the other categories to learn more!

tutorial.content0 = \uf867 [red]Emitters[]\
  \n\
  \n[accent]Serpulo Cores[] act as Emitters. Suspend them with constant [red]damage[] or [cyan]anticreep[].\
  \n[salmon]Suspend all Emitters[] to win the match.\
  \n\
  \n[orange]Nullification[] is optional but helpful.
tutorial.content1 = \uf727 [red]Charged Emitters[]\
  \n\
  \n[accent]Erekir Cores[] and [accent]Launch Pads[] must charge before releasing massive amounts of [blue]Flood[].\
  \nThey are [accent]immune[] while emitting or with lots of [blue]Flood[] around.\
  \nUse [cyan]anticreep[] to break their immunity and deal extra damage.
tutorial.content2 = \uf872 [red]Spore Launchers[]\
  \n\
  \n[accent]Thorium Reactors[] fire long-range [purple]Spores[] that release [blue]Flood[] on impact.\
  \nDefend against [purple]Spores[] with:\
  \n\uf80e [accent]Segments[]\
  \n\uf898 [accent]Force Projectors[]\
  \n\uf682 [accent]Shockwave Towers[]\
  \n\uf7aa[accent]Unit Shields[].
tutorial.content3 = \uf88b [red]Flood Mass Drivers[]\
  \n\
  \n[accent]Mass Drivers[] transport [blue]Flood[] over long distances.
tutorial.content4 = \uf6ad [red]Flood Radars[]\
  \n\
  \n[accent]Radars[] target the highest-health unit after a brief buildup.\
  \nDamage scales with Flood multipliers.
tutorial.content5 = \uf682 [red]Flood Projectors[]\
  \n\
  \n[accent]Shockwave Towers[] deposit [blue]Flood[] onto nearby buildings.
tutorial.content6 = \uf7fa [red]Creeper Units[]\
  \n\
  \n[accent]Crawler Tree units[] explode and release[blue]Flood[] on contact with buildings.\
  \nHigher tier units release significantly more [blue]Flood[].
tutorial.content7 = [cyan]Anticreep[]\
  \n\
  \nPlayers can spread [cyan]Anticreep[] to temporarily block Flood from an area.\
  \n\uf897 [accent]Shock Mines[] – Small area, short duration.\
  \n\uf7fa [accent]Crawlers[] – Medium area, medium duration.\
  \n\uf687[accent]Scathe[] – Large area, long duration.\
  \n\
  \n[crimson]⚠ Warning: [cyan]Anticreep [red]does not[white] remove existing Flood!
tutorial.content8 = \uf7aa[green]Unit Shields[]\
  \n\
  \n\uf7fb [gold]Quasar[] and \uf7c2 [gold]Oct[] shields [red]damage[] the [blue]Flood[], but the [blue]Flood[] also [red]damages[] the shield in return.\
  \nMake sure to not go too far in!
tutorial.content9 = \uf898 [green]Force Projectors[]\
  \n\
  \n[gold]Force Projectors[] slow the spread of [blue]Flood[] instead of damaging it.\
  \n\
  \n[stat]Note:[] [gold]Force Projectors[] are destroyed instantly if touched by [blue]Flood.
tutorial.content10 = \uf6ad [green]Radars[]\
  \n\
  \n[gold]Radars[] reclaim [blue]Flood[] into resources if placed next to a [accent]Container[] or a [stat]Core[].\
  \nResources depend on the [blue]Flood level[].\
  \nThere is a build [accent]limit[].\
  \nUse [slate]/radarinfo[] for details.
tutorial.content11 = \uf866 [green]Stashes[]\
  \n\
  \n[gold]Stashes[] hidden in the [blue]Flood[] contain resources.\
  \nCapture them to claim the contents.\
  \n\
  \n[scarlet]⚠ Caution:[] If a [gold]Stash[] is destroyed, its resources are lost!

tutorial.additions0 = \uf7e4 [pink]Logic[]\
  \n\
  \nLogic is limited for balance. Processors cannot control units.
tutorial.additions1 = \ue84d [pink]Flood Immunity[]\
  \n\
  \n\uf7f1 [accent]Monos[] are [gold]immune[] to [blue]Flood[], making for great delivery units.
tutorial.additions2 = \uf899 [pink]Overdrive[]\
  \n\
  \n[gold]Overdrive Projectors & Domes[] grant ally units the \uf7ab [accent]Overclock[] effect.
tutorial.additions3 = \uf8ac [pink]Walkable Walls[]\
  \n\
  \nUnits can walk on small \uf8a0 [accent]Scrap[],\
  \n\uf8ac [accent]Titanium[], and \uf8a8 [accent]Thorium[] walls.
tutorial.additions4 = \uf7e9 [pink]Helpers[]\
  \n\
  \nEach [accent]Core[] spawns a [gold]Helper[] to mine, build, or attack.

tutorial.modes0 = [sky]\ue861 Flood PvP[]\
  \n\
  \nPvP with a twist! Features include:\
  \n> Polygonal core protection at the start.\
  \n> High-tier crawlers spread Flood to enemy buildings.
tutorial.modes1 = [sky]\ue86e Guardian[]\
  \n\
  \nA random player joins the [blue]Flood[] team with special abilities to help the Flood win.
tutorial.modes2 = [sky]\ue82d Scramble[]\
  \n\
  \nThe ores, walls and tiles of the map are all scrambled up!\
  \nSome maps are scrambled at the beginning of the game or multiple times periodically.\
  \n\
  \nYou can start a vote to scramble the map using [slate]/scramble[].

