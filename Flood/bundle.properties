# Tutorial entries
tutorial.welcome.title = Welcome!
tutorial.welcome = [lightgray]Welcome to the [accent]interactive tutorial menu[]!\
  \nPlease [accent]select the content category[] you'd like to see using the buttons below!
tutorial.forced.title = Oh well...
tutorial.forced = [accent]Hey there!\
  \n\n[lightgray]Looks like you didn't read the tutorial, let's take a (forced) look, shall we?
tutorial.reminder.title = Hi!
tutorial.reminder = [accent]Hey there!\
  \n\n[lightgray]It looks like you've been playing here for quite a while now.\
  \nConsider taking [white]a minute[] of your time to read the quick tutorial to improve your experience here!
tutorial.guardian.title = Guardian tutorial
tutorial.guardian = [accent]Welcome!\
  \n\n[lightgray]Looks like you've been chosen as the guardian, let's quickly go over what your tasks will be:\
  \n[accent]>[] Aid the flood with attacking the player team\
  \n[accent]>[] Create additional traps/contraptions within the flood\
  \n[accent]>[] Use dedicated commands (/tutorial) to interact with the server!\
  \n\nIf you wish not to play as the guardian, use [slate]/resign[] to return to the player team!\
  \nGood luck!

tutorial.intro0 = [blue]\uE83B Flood[] is an attack-style gamemode where your goal is to [red]suspend[] all\
  \n[]\uF867 [stat]Emitters[] and [red]destroy[] all \uF727 [stat]Charged Emitters.
tutorial.intro1 = \uF867 [stat]Emitters[] spawn [blue]Flood[], which [red]damages[] nearby buildings and units directly above it.
tutorial.intro2 = You can [red]suspend[] \uF867 [stat]Emitters[] by constantly dealing [red]damage[] to them.\
  \n\nWhen \uF867 [stat]Emitters[] are fully suspended, you can [orange]nullify[] them by powering an\
  \n\uF871 [accent]Impact Reactor[] / \uF689 [accent]Lustre[] nearby.
tutorial.intro3 = Some quick tips to help you survive!\
  \n\n\uF898[accent]Force Projectors[] are really effective against flood.\
  \n\uF8AE[accent]Wallspam[] is great for early game defending and pushing.\
  \n\uF7FA[accent]Anticreep[] is very powerful for pushing and suspending emitters.
tutorial.intro4 = It is highly recommended you download [blue]Floodcompat[] from the [stat]\u00EE\uE811 Mod Browser[] as it reduces desync and may help with lag issues.
tutorial.intro5 = There are a lot more [pink]special features[] in [blue]\uE83B Flood[].\
  \nYou can learn more about them using the other categories in the main tutorial menu!

tutorial.content0 = \uF867 [red]Emitters[]\
  \n\n[accent]Serpulo Cores[] constantly emit [blue]Flood[].\
  \nYou can [salmon]suspend[] them by either constantly [red]damaging[] them or by spreading [cyan]anticreep[] to them.\
  \nIn order to win, you need to [salmon]suspend[] all [stat]Emitters[].\
  \n\n[orange]Nullifying[] is optional.
tutorial.content1 = \uF727 [red]Charged Emitters[]\
  \n\n[accent]Erekir Cores[] and [accent]Launch Pads[] must charge before releasing [blue]Flood[].\
  \nOnce charged up, the [stat]Charged Emitter[] will start emitting lots of [blue]Flood[] very fast.\
  \nThey become [accent]immune[] while emitting and while surrounded by lots of [blue]Flood[].\
  \nYou can break their [accent]immunity[] and deal extra [red]damage[] by spreading [cyan]anticreep[] to them.
tutorial.content2 = \uF872 [red]Spore Launchers[]\
  \n\n[accent]Thorium Reactors[] fire long distance artillery called [purple]spores[], that release [blue]Flood[] on impact.\
  \nYou can defend against [purple]spores[] with\
  \n\uF80E [accent]Segments[], \uF682 [accent]Shockwave Towers[],\
  \n\uF898 [accent]Force Projectors[], \uF7AA[accent]Unit shields[].\
  \n[purple]Spores[] can collide with units and release [blue]Flood[].
tutorial.content3 = \uF88B [red]Flood Mass Drivers[]\
  \n\n[accent]Mass Drivers[] collect and transport [blue]Flood[] over long distances.
tutorial.content4 = \uF6AD [red]Flood Radars[]\
  \n\n[accent]Radars[] deal [red]damage[] to the [accent]unit[] with the most health after a short buildup.\
  \nScales with flood damage multipliers.
tutorial.content5 = \uF682 [red]Flood Projectors[]\
  \n\n[accent]Shockwave Towers[] deposit [blue]Flood[] at buildings in their range.
tutorial.content6 = \uF7FA [red]Creeper Units[]\
  \n\n[accent]Crawler Tree units[] explode and release[blue]Flood[] when in contact with buildings.\
  \nHigher tier units spread more Flood.
tutorial.content7 = [cyan]Anticreep[]\
  \n\nThere are 3 ways for players to spread [cyan]Anticreep[], which prevents the [blue]Flood[], from spreading in the affected area temporarily.\
  \n\uF897 [accent]Shock Mines[] - [sky]Small[] area with a [sky]short[] duration.\
  \n\uF7FA [accent]Crawlers[] - [sky]Medium[] area with a [sky]medium[] duration.\
  \n\uF687[accent]Scathe[] - [sky]Large[] area with a [sky]long[] duration.\
  \n\n[crimson]\u26A0 Beware! \u26A0\
  \n[cyan]Anticreep [red]does not[white] remove [blue]Flood[] from the area.
tutorial.content8 = \uF7AA[green]Unit Shields[]\
  \n\n\uF7FB [gold]Quasar[] and \uF7C2 [gold]Oct[] shields deal [red]damage[] to the [blue]Flood[].\
  \nDoing this also [red]damages[] the [accent]Unit Shields[].\
  \nMake sure to not go too far in!
tutorial.content9 = \uF898 [green]Force Projectors[]\
  \n\nUnlike [accent]Unit Shields[], [gold]Force Projectors[] slow down the spreading of [blue]Flood[].\
  \n\n[gold]Force Projectors[] instantly die to the [blue]Flood[].
tutorial.content10 = \uF6AD [green]Radars[]\
  \n\n[gold]Radars[] on the player team reclaim [blue]Flood[] into resources.\
  \nA [accent]Container[] or a [stat]Core[] needs to be next to a [gold]Radar[] for it to give resources.\
  \nDifferent [blue]Flood levels[] give different resources.\
  \nThere's a [accent]limit[] on how many [gold]Radars[] you can have at a time.\
  \nFor info about the drops and limit, use [slate]/radarinfo[].
tutorial.content11 = \uF866 [green]Stashes[]\
  \n\nThere can be [gold]Stashes[] inside the [blue]Flood[], which can give various resources.\
  \nCapture the [gold]Stash[] to gain the resources inside.\
  \n\n[scarlet]\u26A0 Make sure to not break it[], as the [gold]Stash[] with its resources [red]will be gone.

tutorial.additions0 = \uF7E4 [pink]Logic[]\
  \n\nCertain limitations affecting [accent]Logic[] were added to balance the gameplay.\
  \nBasic processors can no longer control units to mine, shoot targets or enter payloads.\
  \nOnly \uF7E4 [accent]Micro Processors[] are available to build.
tutorial.additions1 = \uE84D [pink]Flood Immunity[]\
  \n\n\uF7F1 [accent]Monos[] and \uF7F5 [accent]Horizons[] are [gold]immune[] to the [blue]Flood[], making for great delivery units.\
  \n\uF7F5 [accent]Horizons[] are [lightgray]\uF7A5  disarmed[].\
  \nTheir item capacity is 20.
tutorial.additions2 = \uF899 [pink]Overdrive[]\
  \n\n[gold]Overdrive Projectors & Domes[] give ally units the \uF7AB [accent]Overclock[] status effect.
tutorial.additions3 = \uF8AC [pink]Walkable Walls[]\
  \n\nSmall \uF8A0 [accent]Scrap[], \uF8AC [accent]Titanium[] and\
  \n\uF8A8 [accent]Thorium[] walls can be walked on by units.
tutorial.additions4 = \uF7E9 [pink]Helpers[]\
  \n\nEach [accent]Core[] spawns a [gold]Helper[].\
  \n[gold]Helpers[] can mine resources, assist or attack.

tutorial.modes0 = [sky]\uE861 Flood PvP[]\
  \n\nPvP, but with [blue]Flood[]!\
  \nThere are some special features:\
  \n> Polygonal core protection at the start of the match\
  \n> High tier crawler tree units spread flood to enemy buildings
tutorial.modes1 = [sky]\uE86E Guardian[]\
  \n\nOne of the players is randomly selected to be on the [blue]Flood[] team.\
  \nTheir goal is to help the [blue]Flood[] team win.\
  \nThey have special abilities, that help them win.
tutorial.modes2 = [sky]\uE82D Scramble[]\
  \n\nThe ores, walls and tiles of the map are all scrambled up!\
  \nSome maps are scrambled at the beginning of the game or multiple times periodically.\
  \n\nYou can start a vote to scramble the map using [slate]/scramble[].

