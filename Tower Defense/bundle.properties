# Tutorial entries
tutorial.welcome.title = Welcome!
tutorial.welcome = [lightgray]Welcome to the [accent]interactive tutorial menu[]!\
  \nPlease [accent]select the content category[] you'd like to see using the buttons below!
tutorial.forced.title = Oh well...
tutorial.forced = [accent]Hey there!\
    \n\n[lightgray]Looks like you didn't read the tutorial, let's take a (forced) look, shall we?
tutorial.reminder.title = Hi!
tutorial.reminder = [accent]Hey there!\
    \n\n[lightgray]It looks like you've been playing here for quite a while now.\
    \nConsider taking [white]a minute[] of your time to read the quick tutorial to improve your experience here!

tutorial.intro0 = In [orange] Tower Defense[], enemy units can't shoot and follow a [stat]fixed path[].\
    \n\nOnce they reach the  [stat]Core[], they will damage the  [stat]Core[].
tutorial.intro1 = [stat]Enemy units[] drop resources on [red]death[].\
    \n\n[red]There is no other way to get resources in the[]  [stat]Core[].
tutorial.intro2 = Certain game mechanics are changed in\
    \n[orange] Tower Defense[]\
    \n\n[stat] Enemy units[] have no collision[].\
    \n[#ff6f]Fire[] doesn't deal [scarlet]damage[] to buildings.\
    \n [stat]Cores[] don't [red]explode[] on death.
tutorial.intro3 = There is an [stat] Upgrade Shop[] where you can buy upgrades for your team.\
    \nYou can access it using [slate]/shop[].

tutorial.content0 =  [gold]Mono sacrifice[]\
    \n\n[stat]Monos[] circle the [stat]Core[] and sacrifice themselves to heal it.\
    \n\n[red]This is the only way to heal the Cores.
tutorial.content1 =  &  [gold]Electro Fields[]\
    \n\n[accent]Menders[] damage and slow down enemies.\
    \n\n[red]They do not heal the Cores.
tutorial.content2 =  [gold]Sap Projectors[]\
    \n\n[accent]Force Projectors[] slow down enemies and make them take more damage.
tutorial.content3 =  &  [gold]Overclock Turrets[]\
    \n\n[stat]Repair Points[] apply ally units in range the [stat]Overclock[] status.\
    \nPower isn't needed for them.
tutorial.content4 =  [gold]Bullet Boosters[]\
    \n\n[stat]Segments[] increase the damage of bullets in range by [yellow]{0}x[].\
    \nPower isn't needed for them.
tutorial.content5 =  [gold]&[] [gold]Shield Breakers[]\
    \n\n[stat]Foreshadows[] deal [yellow]{0}k[] damage to enemy unit [tan]Shields[].\
    \n[stat]Omuras[] deal [yellow]{1}k[] damage to enemy unit [tan]Shields[].
tutorial.content6 =  [gold]Heavy Support[]\
    \n\n[stat]Octs[] slow down enemies and apply them the [olive]Corroded[] effect.\
    \n[stat]Octs[] apply ally units [stat]Overdrive[] and\
    \n[red]Guardian[] effects.
tutorial.content7 =  [gold]Area Heaters[]\
    \n\n[stat]Regen Projectors[] apply enemies in range [goldenrod]Burning[] and [#ff6f]Melting[] effects.\
    \nThey require [cyan]{0}[] [cyan]Hydrogen/sec[].\
    \n[stat]Phase Fabric[] increases the damage.
tutorial.content8 =  [gold]Unit Radars[]\
    \n\n[stat]Radars[] convert the first enemy that enters their range to your team.\
    \nThey have a cooldown of [cyan]{0} minutes[].\
    \nOnly [cyan]{1}[] of them can exist at once.
tutorial.content9 =  [gold]Phaser Towers[]\
    \n\n[stat]Shockwave Towers[] fire beams at up to [cyan]{0}[] targets.\
    \nEvery beam starts with [cyan]{1} dps[] and can reach up to [cyan]{2} dps[] over time.\
    \nThey require [cyan]{3}[] [cyan]Cyanogen/sec[].