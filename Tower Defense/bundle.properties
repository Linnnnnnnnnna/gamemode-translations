# Tutorial entries
tutorial.welcome.title = Welcome!
tutorial.welcome = [lightgray]Welcome to the [accent]interactive tutorial[]!\
  \nSelect a category below to learn more about Tower Defense!
tutorial.forced.title = Oh well...
tutorial.forced = [accent]Hey there!\
  \n\
  \n[lightgray]Looks like you missed the tutorial. Let’s take a quick look together!
tutorial.reminder.title = Hi!
tutorial.reminder = [accent]Hey there!\
  \n\
  \n[lightgray]Looks like you’ve been playing for a while!\
  \nWhy not take [white]one minute[] to read the tutorial and discover new features?

tutorial.intro0 = In [orange]\ue86d Tower Defense[], enemy units can’t shoot and follow a [stat]fixed path[].\
  \n\
  \nOnce they reach the \uf867 [stat]Core[], they damage it.
tutorial.intro1 = [stat]Enemy units[] drop resources when they [red]die[].\
  \n\
  \n[red]There is no other way to get resources to the[] \uf867 [stat]Core[].
tutorial.intro2 = Some mechanics are unique to\
  \n[orange]\ue86d Tower Defense[]\
  \n\
  \n[stat]\ue86d Enemy units[] have no collision[].\
  \n[#ff6f]\uf7b6Fire[] doesn't deal [scarlet]damage[] to buildings.\
  \n\uf869 [stat]Cores[] don’t [red]explode[] on death.
tutorial.intro3 = Use the [stat]\ue804 Upgrade Shop[] to buy team upgrades.\
  \nOpen it with [slate]/shop[].

tutorial.content0 = \uf7f1 [gold]Mono sacrifice[]\
  \n\
  \n[stat]Monos[] circle the [stat]Core[] and sacrifice themselves to heal it.\
  \n\
  \n[red]This is the only way to heal the Cores.
tutorial.content1 = \uf89b & \uf89a [gold]Electro Fields[]\
  \n\
  \n[accent]Menders[] damage and slow down enemies.\
  \n\
  \n[red]They do not heal the Cores.
tutorial.content2 = \uf898 [gold]Sap Projectors[]\
  \n\
  \n[accent]Force Projectors[] slow down enemies and increase the damage they take.
tutorial.content3 = \uf848 & \uf790 [gold]Overclock Turrets[]\
  \n\
  \n[stat]Repair Points[] grant nearby ally units the \uf7ab[stat]Overclock[] status.\
  \nThey don’t require power.
tutorial.content4 = \uf80e [gold]Bullet Boosters[]\
  \n\
  \n[stat]Segments[] and [stat]Build Towers[] multiply bullet damage in range by [yellow]{0}x[].\
  \nThey don’t require power.
tutorial.content5 = \uf7be [gold]&[] \uf7c6[gold]Shield Breakers[]\
  \n\
  \n[stat]Foreshadows[] deal [yellow]{0}k[] damage to enemy [tan]\uf7aaShields[].\
  \n[stat]Omuras[] deal [yellow]{1}k[] damage to enemy [tan]\uf7aaShields[].
tutorial.content6 = \uf7c2 [gold]Heavy Support[]\
  \n\
  \n[stat]Octs[] slow down enemies and apply the \uf7a6[olive]Corroded[] effect.\
  \n[stat]Octs[] apply ally units \uf7ac[stat]Overdrive[] and\
  \n\uf7a9[red]Guardian[] effects.
tutorial.content7 = \uf6ff [gold]Area Heaters[]\
  \n\
  \n[stat]Regen Projectors[] apply \uf7b6[goldenrod]Burning[] and \uf7b0[#ff6f]Melting[] to enemies in range.\
  \nThey require [cyan]{0}[] \uf71f[cyan]Hydrogen/sec[].\
  \n\uf82d[stat]Phase Fabric[] increases damage.
tutorial.content8 = \uf6ad [gold]Unit Radars[]\
  \n\
  \n[stat]Radars[] convert the first enemy that enters their range to your team.\
  \nCooldown: [cyan]{0} minutes[].\
  \nOnly [cyan]{1}[] can exist at once.
tutorial.content9 = \uf682 [gold]Phaser Towers[]\
  \n\
  \n[stat]Shockwave Towers[] fire beams at up to [cyan]{0}[] targets.\
  \nEvery beam starts at [cyan]{1} dps[] and ramps up to [cyan]{2} dps[].\
  \nThey require [cyan]{3}[] \uf714[cyan]Cyanogen/sec[].
